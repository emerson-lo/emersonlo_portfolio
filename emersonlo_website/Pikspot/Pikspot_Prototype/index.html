<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pikspot prototype</title>
<style>
  @font-face {
    font-family: 'Albert Sans'; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url("fonts/albert-sans-latin.woff2") format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Albert Sans'; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url("fonts/albert-sans-latin-ext.woff2") format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  /* transparent, so the page behind shows around the phone */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: "Albert Sans", -apple-system, sans-serif; }
  #root { position: absolute; left: 50%; top: 50%; }
  a { color: rgb(53,163,252); } a:hover { color: rgb(53,57,53); }
  @keyframes pkpop { 0% { transform: scale(1) } 40% { transform: scale(1.35) } 100% { transform: scale(1) } }
  @keyframes pkpopin { 0% { transform: scale(.4); opacity: 0 } 70% { transform: scale(1.06); opacity: 1 } 100% { transform: scale(1); opacity: 1 } }
  @keyframes pkin { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @keyframes pkfade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes pkslide { from { transform: translateX(36px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes pkburst { 0% { transform: scale(.2); opacity: 0 } 30% { transform: scale(1.1); opacity: .95 } 70% { transform: scale(1); opacity: .95 } 100% { transform: scale(1.25); opacity: 0 } }
  @keyframes pkmarq { from { transform: translateY(0) } to { transform: translateY(-472px) } }
  @keyframes pkspin { to { transform: rotate(360deg) } }
  @keyframes pkpulse { 0% { transform: scale(.7); opacity: .9 } 100% { transform: scale(1.5); opacity: 0 } }
  @keyframes pktoast { 0% { opacity: 0; transform: translate(-50%,10px) } 10%, 85% { opacity: 1; transform: translate(-50%,0) } 100% { opacity: 0; transform: translate(-50%,0) } }
</style>
</head>
<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="prototype.js"></script>
</body>
</html>
